<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1F3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Order Inspector">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Royal Welcome Order Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1F3D; --navy-2:#182C52; --gold:#C8A24A; --gold-soft:#F1E6C6;
  --bg:#EDF0F5; --card:#FFFFFF; --ink:#16233B; --muted:#6A7690; --line:#E1E6EF;
  --ok:#1E8E5A; --ok-bg:#E3F5EC; --bad:#C0392B; --bad-bg:#FBE8E5;
  --run:#1F6FD1; --run-bg:#E2EEFC; --wait:#9A7416; --wait-bg:#F7EDCF;
  --wa:#1FAF5B; --star:#D6A21E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}

/* ---------- top ---------- */
.top{
  background:var(--navy);color:#fff;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px 22px;
  border-bottom:3px solid var(--gold);
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.brand h1 span{color:var(--gold);font-size:13px;font-weight:600}
.brand button{background:none;border:0;color:#9FB0D0;font-size:12px;padding:4px 0}

.search{display:flex;gap:8px;margin-top:16px}
.search input{
  flex:1;min-width:0;height:50px;border-radius:12px;border:2px solid transparent;
  padding:0 14px;font-size:17px;font-weight:600;background:#fff;color:var(--ink);
}
.search input:focus{outline:none;border-color:var(--gold)}
.search input::placeholder{font-weight:500;color:#9AA5BB;font-size:15px}
.search button{
  height:50px;padding:0 20px;border:0;border-radius:12px;background:var(--gold);
  color:var(--navy);font-weight:800;font-size:16px;
}
.search button:active{transform:scale(.97)}

/* ---------- body ---------- */
main{padding:16px 14px 0;max-width:560px;margin:0 auto}
.note{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;color:var(--muted);text-align:center;
}
.note.err{color:var(--bad);background:var(--bad-bg);border-color:#F2C9C3}
.spin{
  width:26px;height:26px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--gold);margin:0 auto 8px;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.back{border:0;background:none;color:var(--navy);font-weight:800;font-size:14px;padding:2px 0 10px}

/* ---------- lists ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{
  border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px 8px;
  text-align:center;color:var(--muted);
}
.tab b{display:block;font-size:21px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.tab span{display:block;font-size:11.5px;font-weight:700;margin-top:1px}
.tab.on{background:var(--navy);border-color:var(--navy)}
.tab.on b{color:#fff}
.tab.on span{color:var(--gold-soft)}

.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px;font-size:13px;color:var(--muted);font-weight:600}
.sum .refresh{
  flex:0 0 auto;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--navy);
  border-radius:8px;padding:5px 11px;font-weight:700;font-size:12px;
}

.li{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:10px 4px 10px 14px;margin-bottom:8px;
}
.li.hl{border-left:4px solid var(--gold);padding-left:11px}
.li:active{background:#F7F9FC}
.li-main{flex:1;min-width:0}
.li-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.li-top b{font-size:16px;font-variant-numeric:tabular-nums}
.li-top .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .pill{font-size:11px;padding:4px 9px;margin:0;flex:0 0 auto}

.star{
  border:0;background:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  color:#B3BBCB;flex:0 0 auto;
}
.star.on{color:var(--star)}
.star svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star.on svg{fill:currentColor}

/* ---------- search chips ---------- */
.count{margin:0 2px 8px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;
}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on small{color:var(--gold-soft)}

/* ---------- order card ---------- */
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.head{padding:16px 10px 14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.head .lbl{font-size:12px;color:var(--muted);font-weight:600}
.head .ono{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.head-r{display:flex;align-items:center;gap:2px}
.pill{
  border-radius:999px;padding:6px 13px;font-weight:800;font-size:13px;white-space:nowrap;
  background:var(--wait-bg);color:var(--wait);
}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.run{background:var(--run-bg);color:var(--run)}

.rows{margin:0;padding:0 18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row dt{color:var(--muted);font-size:13px;font-weight:600;flex:0 0 auto}
.row dd{margin:0;font-weight:700;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.row dd.cod{font-size:20px;color:var(--navy)}
.trk{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.copy{
  border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--navy);
  border-radius:8px;padding:4px 10px;font-weight:700;font-size:12px;
}

.msg{margin:6px 14px 16px;border:1px dashed #D6BE82;background:#FFFCF2;border-radius:12px;padding:12px 14px}
.msg h3{margin:0 0 6px;font-size:13px;color:var(--wait)}
.msg pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;color:var(--ink)}
.msg button{margin-top:10px}

/* ---------- action bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:10px;
  box-shadow:0 -6px 18px rgba(15,31,61,.08);
}
.bar.show{display:flex}
.bar a{
  flex:1;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;font-weight:800;font-size:16px;
}
.bar .wa{background:var(--wa);color:#fff;flex:2}
.bar .call{background:var(--navy);color:#fff}
.bar svg{width:20px;height:20px;fill:currentColor}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:8;max-width:90vw;text-align:center;
}
.toast.show{opacity:1}
.bar.show ~ .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}

/* ---------- login ---------- */
.login{position:fixed;inset:0;background:var(--navy);display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
.login.show{display:flex}
.login form{width:100%;max-width:340px;color:#fff}
.login h2{margin:0 0 4px;font-size:24px}
.login p{margin:0 0 18px;color:#9FB0D0}
.login input{width:100%;height:50px;border-radius:12px;border:2px solid transparent;padding:0 14px;font-size:17px}
.login input:focus{outline:none;border-color:var(--gold)}
.login button{margin-top:12px;width:100%;height:50px;border:0;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:800;font-size:16px}
.login .e{color:#FFB4AA;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <h2>Royal Welcome</h2>
    <p>Team password likhein</p>
    <input id="keyInput" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="e" id="loginErr"></div>
    <button type="submit">Open</button>
  </form>
</div>

<header class="top">
  <div class="brand">
    <h1>Order Inspector <span>Royal Welcome</span></h1>
    <div>
      <button id="install" type="button" hidden style="color:var(--gold);font-weight:700;margin-right:12px">Install app</button>
      <button id="logout" type="button">Logout</button>
    </div>
  </div>
  <form class="search" id="searchForm">
    <input id="q" type="search" inputmode="numeric" autocomplete="off" placeholder="Number, order no ya tracking ID">
    <button type="submit">Search</button>
  </form>
</header>

<main id="main"></main>

<nav class="bar" id="bar">
  <a class="call" id="callBtn" href="#">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
    Call
  </a>
  <a class="wa" id="waBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.25.7-1.45 1.3-2 1.35-.5.05-1.15.07-1.85-.12a15 15 0 0 1-1.7-.63c-3-1.3-4.95-4.35-5.1-4.55-.15-.2-1.2-1.6-1.2-3s.75-2.1 1-2.4c.27-.3.58-.37.78-.37h.55c.18 0 .42-.07.65.5.25.6.85 2.07.92 2.22.08.15.12.33.02.52-.1.2-.15.32-.3.5-.15.17-.3.38-.45.5-.15.15-.3.3-.13.6.17.3.78 1.28 1.67 2.07 1.15 1 2.1 1.33 2.4 1.48.3.15.48.12.65-.07.18-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.72.82 2.02.97.3.15.5.22.57.35.07.12.07.72-.18 1.4z"/></svg>
    WhatsApp
  </a>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============ SETTINGS ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwfhG5-H93dII9oNmNaPheHj2Vnq5gqqXJ2Phw7i2vE0b-gPlva8R8MMKetc6eBV0Ym5Q/exec';
const BRAND   = 'Royal Welcome';
const TRACK_URL = 'https://postextracking.com.pk/';
const SITE_URL  = 'https://royalwelcome.shop/';
/* ================================== */

const $ = id => document.getElementById(id);
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 17.3l-5.6 3.3 1.5-6.3L3 9.9l6.4-.5L12 3.5l2.6 5.9 6.4.5-4.9 4.4 1.5 6.3z"/></svg>';

let orders = [], sel = 0;            // detail view data
let view = 'list';                   // 'list' | 'detail'
let lists = null, listsAt = 0;       // {out, last, lastDate, hl}
let tab = 'out';
let hlSet = new Set();
let listScroll = 0;

function getKey(){ try{ return localStorage.getItem('rw_key') || ''; }catch(e){ return ''; } }
function setKey(k){ try{ localStorage.setItem('rw_key', k); }catch(e){} }
function clearKey(){ try{ localStorage.removeItem('rw_key'); }catch(e){} }

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function digits(s){ return String(s || '').replace(/\D/g, ''); }
function last10(s){ return digits(s).slice(-10); }
function prettyPhone(s){
  const d = last10(s);
  return d.length === 10 ? '0' + d.slice(0,3) + ' ' + d.slice(3) : String(s || '');
}
function toast(t){
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- API ---------- */
async function api(params){
  const key = getKey();
  if (!key){ showLogin(); throw new Error('nokey'); }
  const qs = new URLSearchParams(Object.assign({key: key}, params)).toString();
  const r = await fetch(API_URL + '?' + qs);
  const d = await r.json();
  if (!d.ok && /Password/i.test(d.error || '')){ clearKey(); showLogin('Password galat hai'); }
  return d;
}
function setHl(arr){ hlSet = new Set((arr || []).map(String)); }

/* ---------- status ---------- */
function statusInfo(o){
  const s = String(o.status || '').trim().toUpperCase();
  if (s === 'DELIVERED') return {cls:'ok',  text:'Delivered'};
  if (s === 'RETURNED')  return {cls:'bad', text:'Returned'};
  if (['CANCAL','CANCELLED','CANCELED'].includes(s)) return {cls:'bad', text:'Cancelled'};
  if (s.indexOf('OUT FOR') !== -1) return {cls:'run', text:o.status};
  if (!s) return {cls:'', text: o.tracking ? 'In transit' : 'Process mein'};
  return {cls:'run', text:o.status};
}

/* ---------- WhatsApp message ---------- */
function buildMsg(o){
  const nm  = (!o.name || String(o.name).trim().toUpperCase() === 'NO NAME') ? 'Customer' : o.name;
  const s   = String(o.status || '').trim().toUpperCase();
  const trk = String(o.tracking || '').trim();
  const tl  = trk ? '\nParcel track karein: ' + TRACK_URL : '';
  let body;
  if (s === 'DELIVERED'){
    body = 'Aapka order #' + o.orderNo + ' deliver ho chuka hai. Hamare saath shopping karne ka shukriya! Agar product pasand aaye to apna feedback zaroor dein.';
  } else if (s === 'RETURNED'){
    body = 'Aapka order #' + o.orderNo + ' return ho gaya hai.' + (trk ? ' Tracking ID: ' + trk : '') + ' Agar dobara order karna chahein ya koi masla ho to humein bata dein.' + tl;
  } else if (['CANCAL','CANCELLED','CANCELED'].includes(s)){
    body = 'Aapka order #' + o.orderNo + ' cancel kar diya gaya hai. Agar dobara order karna ho to humein message karein.';
  } else if (s.indexOf('OUT FOR') !== -1){
    body = 'Aapka order #' + o.orderNo + ' aaj delivery ke liye nikal chuka hai.\nTracking ID: ' + trk + tl + '\nCOD: Rs ' + o.cod + '\nMeherbani kar ke apna phone on rakhein aur payment tayyar rakhein, courier aap se rabta karega.';
  } else if (trk){
    body = 'Aapka order #' + o.orderNo + ' rawana ho chuka hai.\nStatus: ' + o.status + '\nTracking ID: ' + trk + tl + '\nCOD: Rs ' + o.cod + '\nMeherbani kar ke parcel receive karte waqt payment tayyar rakhein.';
  } else {
    body = 'Aapka order #' + o.orderNo + ' process mein hai.\nCOD: Rs ' + o.cod + '\nTracking ID jaldi bhej di jayegi.';
  }
  return 'Assalam o Alaikum ' + nm + ',\n' + body + '\n\n- ' + BRAND + '\nHamari website: ' + SITE_URL;
}

/* ---------- small UI helpers ---------- */
function showNote(html, err, withBack){
  $('main').innerHTML = '<div class="note' + (err ? ' err' : '') + '">' + html + '</div>'
    + (withBack ? '<p style="text-align:center"><button type="button" class="back" id="noteBack">&larr; Lists par wapis</button></p>' : '');
  $('bar').classList.remove('show');
  const nb = $('noteBack'); if (nb) nb.addEventListener('click', () => showList());
}
function showLogin(msg){
  $('loginErr').textContent = msg || '';
  $('login').classList.add('show');
  setTimeout(() => $('keyInput').focus(), 50);
}
function copyText(t, btn){
  const done = () => { if(btn){ const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = old, 1200); } };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, fallback);
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); done();
  }
}
function isHl(o){ return hlSet.has(digits(o.orderNo)); }
function sumCod(arr){ return arr.reduce((t, o) => t + (parseInt(digits(o.cod), 10) || 0), 0); }

/* ---------- highlight ---------- */
async function toggleHl(o){
  const no = digits(o.orderNo);
  const on = !hlSet.has(no);
  applyHl(o, on);
  try{
    const d = await api({action:'hl', order:no, on:on ? 1 : 0});
    if (!d.ok) throw new Error(d.error || 'fail');
    setHl(d.hlSet);
    toast(on ? 'Highlight ho gaya' : 'Highlight hat gaya');
  }catch(e){
    applyHl(o, !on);
    toast('Save nahi hua. Internet check karein.');
  }
}
function applyHl(o, on){
  const no = digits(o.orderNo);
  if (on) hlSet.add(no); else hlSet.delete(no);
  if (lists){
    lists.hl = lists.hl.filter(x => digits(x.orderNo) !== no);
    if (on) lists.hl.unshift(o);
  }
  refreshView();
}
function refreshView(){ if (view === 'detail') render(); else renderList(); }

/* ---------- lists view ---------- */
async function loadLists(force){
  if (!force && lists && Date.now() - listsAt < 120000){ renderList(); return; }
  if (!getKey()){ showLogin(); return; }
  if (!lists) showNote('<div class="spin"></div>Lists load ho rahi hain...');
  try{
    const d = await api({action:'lists', fresh: force ? 1 : 0});
    if (!d.ok){ if (!lists) showNote(esc(d.error || 'Kuch masla aa gaya'), true); else toast(d.error || 'Refresh nahi hua'); return; }
    lists = {out:d.out, last:d.last, lastDate:d.lastDate, hl:d.hl}; listsAt = Date.now();
    try{ localStorage.setItem('rw_lists', JSON.stringify(lists)); }catch(e){}
    setHl(d.hlSet);
    if (view === 'list') renderList();
  }catch(e){
    if (!lists) showNote('Internet ya link ka masla hai.<br><br><button type="button" class="copy" id="retry">Dobara try karein</button>', true);
    else toast('Internet ka masla hai');
    const rb = $('retry'); if (rb) rb.addEventListener('click', () => loadLists(true));
  }
}
function showList(){
  view = 'list'; $('bar').classList.remove('show');
  if (lists && Date.now() - listsAt >= 120000){ renderList(); loadLists(true); return; }
  if (lists) renderList(); else loadLists(true);
  setTimeout(() => window.scrollTo({top: listScroll}), 0);
}
function liHTML(o){
  const st = statusInfo(o);
  const hl = isHl(o);
  const nm = (!o.name || String(o.name).trim().toUpperCase() === 'NO NAME') ? 'No name' : o.name;
  return '<div class="li' + (hl ? ' hl' : '') + '" data-no="' + esc(digits(o.orderNo)) + '">'
    + '<div class="li-main"><div class="li-top"><b>#' + esc(o.orderNo) + '</b><span class="nm">' + esc(nm) + '</span></div>'
    + '<div class="li-sub">' + esc(o.city || '-') + ' &middot; Rs ' + esc(o.cod || '0') + ' &middot; ' + esc(o.date || '') + '</div></div>'
    + '<span class="pill ' + st.cls + '">' + esc(st.text) + '</span>'
    + '<button type="button" class="star' + (hl ? ' on' : '') + '" aria-label="Highlight">' + STAR + '</button>'
    + '</div>';
}
function currentArr(){ return !lists ? [] : (tab === 'out' ? lists.out : tab === 'last' ? lists.last : lists.hl); }
/* ---------- PDF download (Out for Delivery / Highlighted) ---------- */
function loadScript(src){
  return new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => no(new Error('load')); document.head.appendChild(el); });
}
async function downloadPdf(which){
  const hl = which === 'hl';
  const arr = hl ? lists.hl : lists.out;
  if (!arr.length){ toast('List khali hai'); return; }
  toast('PDF ban rahi hai...');
  try{
    if (!(window.jspdf && window.jspdf.jsPDF)){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
    }
    const doc = new window.jspdf.jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
    const pad = n => String(n).padStart(2, '0'), now = new Date();
    const day = pad(now.getDate()) + '-' + pad(now.getMonth() + 1) + '-' + now.getFullYear();
    const title = hl ? 'Highlighted Orders' : 'Out for Delivery';
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Royal Welcome - ' + title, 40, 42);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.text(day + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + '   |   ' + arr.length + ' orders   |   Total COD: Rs ' + sumCod(arr).toLocaleString('en-US'), 40, 58);
    const head = ['#', 'Order No', 'Name', 'City', 'Amount', 'Tracking ID', 'Booking Date'].concat(hl ? ['Status'] : []);
    const body = arr.map((o, i) => [i + 1, o.orderNo, o.name || '', o.city || '', 'Rs ' + (o.cod || 0), o.tracking || '-', o.date || '']
      .concat(hl ? [statusInfo(o).text] : []));
    doc.autoTable({
      head: [head], body: body, startY: 70, theme: 'grid',
      styles: {fontSize: hl ? 8 : 9, cellPadding: 4},
      headStyles: {fillColor: [15, 31, 61], textColor: [200, 162, 74]},
      alternateRowStyles: {fillColor: [245, 247, 251]},
      columnStyles: {0: {cellWidth: 22}, 4: {halign: 'right'}}
    });
    doc.save((hl ? 'Highlighted_Orders_' : 'Out_for_Delivery_') + day + '.pdf');
  }catch(e){ toast('PDF nahi ban saki. Internet check karein.'); }
}

function renderList(){
  view = 'list'; $('bar').classList.remove('show');
  if (!lists){ showNote('<div class="spin"></div>Lists load ho rahi hain...'); return; }
  const arr = currentArr();
  let h = '<div class="tabs">'
    + tabBtn('out', lists.out.length, 'Out for Delivery')
    + tabBtn('last', lists.last.length, 'Aakhri Date')
    + tabBtn('hl', lists.hl.length, 'Highlighted')
    + '</div>';

  let sum;
  if (tab === 'out')       sum = arr.length + ' parcel &middot; COD Rs ' + sumCod(arr).toLocaleString('en-US');
  else if (tab === 'last') sum = esc(lists.lastDate || '-') + ' &middot; ' + arr.length + ' orders &middot; COD Rs ' + sumCod(arr).toLocaleString('en-US');
  else                     sum = arr.length + ' highlighted. Star dabane se list se hat jayega.';
  h += '<div class="sum"><span>' + sum + '</span><span>' + (tab !== 'last' && arr.length ? '<button type="button" class="refresh" id="dl">PDF</button> ' : '') + '<button type="button" class="refresh" id="refresh">Refresh</button></span></div>';

  if (!arr.length){
    const msg = tab === 'out' ? 'Abhi koi order Out for Delivery nahi hai.'
              : tab === 'last' ? 'Aakhri date ki koi entry nahi mili.'
              : 'Koi order highlight nahi hai. Kisi order ke star par tap karein.';
    h += '<div class="note">' + msg + '</div>';
  } else {
    h += arr.map(liHTML).join('');
  }
  $('main').innerHTML = h;

  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; renderList(); }));
  $('refresh').addEventListener('click', () => { toast('Refresh ho raha hai...'); loadLists(true); });
  if ($('dl')) $('dl').addEventListener('click', () => downloadPdf(tab));
  document.querySelectorAll('.li').forEach(el => el.addEventListener('click', e => {
    const o = currentArr().find(x => digits(x.orderNo) === el.dataset.no);
    if (!o) return;
    if (e.target.closest('.star')){ toggleHl(o); return; }
    listScroll = window.scrollY;
    orders = [o]; sel = 0; view = 'detail'; render(); window.scrollTo({top:0});
  }));
}
function tabBtn(t, n, label){
  return '<button type="button" class="tab' + (tab === t ? ' on' : '') + '" data-t="' + t + '"><b>' + n + '</b><span>' + label + '</span></button>';
}

/* ---------- detail view ---------- */
function render(){
  view = 'detail';
  const o = orders[sel];
  const st = statusInfo(o);
  const msg = buildMsg(o);
  const ph  = last10(o.number);
  const hl  = isHl(o);

  let h = '<button type="button" class="back" id="back">&larr; Lists</button>';
  if (orders.length > 1){
    h += '<p class="count">' + orders.length + ' orders mile hain. Naya order sab se pehle hai.</p><div class="chips">';
    orders.forEach((x, i) => {
      h += '<button type="button" class="chip' + (i === sel ? ' on' : '') + '" data-i="' + i + '">#' + esc(x.orderNo) + '<small>' + esc(x.date) + '</small></button>';
    });
    h += '</div>';
  }

  h += '<section class="card">'
    + '<div class="head"><div><div class="lbl">Order No</div><div class="ono">#' + esc(o.orderNo) + '</div></div>'
    + '<div class="head-r"><span class="pill ' + st.cls + '">' + esc(st.text) + '</span>'
    + '<button type="button" class="star' + (hl ? ' on' : '') + '" id="hlBtn" aria-label="Highlight">' + STAR + '</button></div></div>'
    + '<dl class="rows">'
    + row('Customer', esc(o.name || '-'))
    + row('Number', esc(prettyPhone(o.number)))
    + row('City', esc(o.city || '-'))
    + row('COD', 'Rs ' + esc(o.cod || '0'), 'cod')
    + row('Order date', esc(o.date || '-'))
    + (o.tracking
        ? '<div class="row"><dt>Tracking ID</dt><dd><div class="trk"><span>' + esc(o.tracking) + '</span><button type="button" class="copy" id="cpTrk">Copy</button></div></dd></div>'
        : row('Tracking ID', 'Abhi nahi mili'))
    + row('Last synced', esc(o.synced || '-'))
    + '</dl>'
    + '<div class="msg"><h3>WhatsApp message</h3><pre>' + esc(msg) + '</pre>'
    + '<button type="button" class="copy" id="cpMsg">Copy message</button></div>'
    + '</section>';

  $('main').innerHTML = h;

  $('back').addEventListener('click', () => { showList(); });
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { sel = +b.dataset.i; render(); window.scrollTo({top:0}); }));
  const ct = $('cpTrk'); if (ct) ct.addEventListener('click', () => copyText(o.tracking, ct));
  $('cpMsg').addEventListener('click', e => copyText(msg, e.currentTarget));
  $('hlBtn').addEventListener('click', () => toggleHl(o));

  $('waBtn').href   = ph.length === 10 ? 'https://wa.me/92' + ph + '?text=' + encodeURIComponent(msg) : '#';
  $('callBtn').href = ph.length === 10 ? 'tel:+92' + ph : '#';
  $('bar').classList.add('show');
}
function row(k, v, cls){ return '<div class="row"><dt>' + k + '</dt><dd' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</dd></div>'; }

/* ---------- search ---------- */
async function search(raw){
  const q = digits(raw);
  if (q.length < 3){ toast('Kam az kam 3 digits likhein'); return; }
  if (!API_URL || API_URL.indexOf('PASTE_') === 0){ showNote('App ka API link abhi set nahi hua.', true); return; }
  if (!getKey()){ showLogin(); return; }

  if (view === 'list') listScroll = window.scrollY;
  view = 'detail';
  showNote('<div class="spin"></div>Dhoond raha hoon...');
  try{
    const d = await api({q: q});
    if (!d.ok){ showNote(esc(d.error || 'Kuch masla aa gaya'), true, true); return; }
    setHl(d.hlSet);
    if (!d.orders.length){
      showNote('<b>' + esc(q) + '</b> ka koi order nahi mila.<br>Number, order no ya tracking ID dobara check karein.', false, true);
      return;
    }
    orders = d.orders; sel = 0; render(); window.scrollTo({top:0});
  }catch(e){
    showNote('Internet ya link ka masla hai. Dobara try karein.', true, true);
  }
}

/* ---------- events ---------- */
$('searchForm').addEventListener('submit', e => { e.preventDefault(); search($('q').value); $('q').blur(); });
$('q').addEventListener('input', () => { if (!$('q').value && view === 'detail') showList(); });
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const k = $('keyInput').value.trim(); if (!k) return;
  setKey(k); $('keyInput').value = ''; $('login').classList.remove('show');
  if ($('q').value) search($('q').value); else loadLists(true);
});
$('logout').addEventListener('click', () => { clearKey(); try{ localStorage.removeItem('rw_lists'); }catch(e){} lists = null; orders = []; $('main').innerHTML = ''; $('bar').classList.remove('show'); showLogin(); });

/* ---------- install as app ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e; $('install').hidden = false;
});
$('install').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try{ await installEvt.userChoice; }catch(e){}
  installEvt = null; $('install').hidden = true;
});
window.addEventListener('appinstalled', () => { $('install').hidden = true; });
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- start ---------- */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && view === 'list' && lists && Date.now() - listsAt > 120000) loadLists(true);
});
try{ const c = JSON.parse(localStorage.getItem('rw_lists') || 'null'); if (c && c.out && c.last && c.hl){ lists = c; setHl(c.hl.map(o => digits(o.orderNo))); } }catch(e){}
if (!getKey()) showLogin(); else { if (lists) renderList(); loadLists(true); }
</script>
