<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1F3D">
<meta name="robots" content="noindex">
<link rel="manifest" href="rider-manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Royal Welcome Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F1F3D;--gold:#C8A24A;--bg:#F4F6FA;--ink:#1B2740;--muted:#6B778C;--line:#E3E8F0;--ok:#1E8E5A;--ok-bg:#E3F5EC;--bad:#C0392B;--bad-bg:#FBE8E5;--run:#1F6FD1;--run-bg:#E2EEFC;--wait:#9A7416;--wait-bg:#F7EDCF;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:48px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{margin:0;font-size:15px}.top small{display:block;color:#9FB0D0;font-size:12px}
.top button{background:none;border:1px solid rgba(255,255,255,.25);color:#C5D0E6;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px}
.tabs{display:flex;gap:2px;background:#E3E8F0;margin:12px 14px;padding:3px;border-radius:10px;max-width:532px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 4px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tab.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.tab b{color:var(--gold)}
main{max-width:560px;margin:0 auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.fld{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
.fld input,.manual input,.card input[type=date],.card select{display:block;width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#F7F9FC;margin-top:4px;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;border-radius:10px;border:1.5px solid #D3DAE6;background:#fff;color:var(--navy);font-weight:700;font-size:14px;margin-top:10px;cursor:pointer}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.manual{display:flex;gap:8px;margin-top:10px}.manual input{margin:0;flex:1}.manual .btn{margin:0;width:90px}
#cam{margin-top:6px;border-radius:12px;overflow:hidden;background:#000}
#vid{display:block;width:100%;max-height:240px;object-fit:cover}
.sumline{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:12.5px;margin:4px 2px 10px}
.li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.lh{display:flex;align-items:center;gap:8px}.lh b{font-size:15px}.nm{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls{color:var(--muted);font-size:12.5px;margin-top:3px}.ls a{color:var(--run);text-decoration:none;font-weight:600}
.pill{border-radius:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;background:var(--wait-bg);color:var(--wait);white-space:nowrap}
.pill.run{background:var(--run-bg);color:var(--run)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.dcr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.dcr input{width:110px;height:38px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;background:#F7F9FC}
.dcdone{height:38px;padding:0 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700}
.dcl{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ok)}
.rm{margin-top:6px;background:#FBF5E3;color:#5C4A12;border-radius:8px;padding:5px 9px;font-size:12.5px;word-break:break-word}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ab{height:42px;border-radius:10px;border:1.5px solid #D3DAE6;background:#fff;font-weight:700;font-size:13px}
.ab.ok{color:var(--ok);border-color:#BFE3CF;background:var(--ok-bg)}.ab.wait{color:var(--wait);border-color:#EBD79A;background:var(--wait-bg)}.ab.bad{color:var(--bad);border-color:#F0C4BE;background:var(--bad-bg)}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}
.note.warn{background:var(--wait-bg);border-color:#EBD79A;color:#5C4A12;text-align:left}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.tile span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pay .r{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}
.pay .r:last-child{border:0}.pay .r span{color:var(--muted);font-weight:600}
.pay .tot{font-size:18px;color:var(--navy)}.pay .tot b{font-size:20px}
.pay input{width:120px;height:38px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;text-align:right;font-size:15px;background:#F7F9FC}
h3{margin:14px 2px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.login{position:fixed;inset:0;background:linear-gradient(160deg,#0F1F3D,#182C52);display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
.login.show{display:flex}
.login form{width:100%;max-width:340px;background:#fff;border-radius:20px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login img{display:block;width:64px;height:64px;border-radius:16px;margin:0 auto 12px}
.login h2{margin:0;text-align:center;font-size:20px}.login p{text-align:center;color:var(--muted);margin:2px 0 16px}
.login input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:#F7F9FC;margin-bottom:10px}
.login .e{color:var(--bad);text-align:center;min-height:18px;font-size:13px}
.login button{width:100%;height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(15,31,61,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.msheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.msheet h4{margin:0 0 10px;font-size:16px}
.msheet textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.mb{display:flex;gap:10px;margin-top:12px}.mb button{flex:1;height:46px;border:0;border-radius:12px;font-weight:700;font-size:15px}
#mNo{background:#EEF1F6;color:var(--ink)}#mYes{background:var(--navy);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;display:none;z-index:20;max-width:90%;text-align:center}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);margin:0 auto 8px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <img src="icon-192.png" alt="" onerror="this.style.display='none'">
    <h2>Royal Welcome</h2>
    <p>Rider sign in</p>
    <input id="userIn" type="text" autocomplete="username" autocapitalize="none" placeholder="Username" required>
    <input id="keyIn" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="e" id="loginErr"></div>
    <button type="submit">Sign in</button>
  </form>
</div>

<header class="top">
  <div><h1>Royal Welcome Rider</h1><small id="who">&nbsp;</small></div>
  <button id="logout" type="button">Logout</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-t="pickup" type="button">Pickup</button>
  <button class="tab" data-t="del" type="button">Deliveries <b id="delCnt"></b></button>
  <button class="tab" data-t="rep" type="button">Report</button>
</nav>

<main>
  <section id="v-pickup">
    <div class="card">
      <label class="fld">Default D.C for new parcels (Rs)
        <input id="dcDef" inputmode="numeric" placeholder="e.g. 150">
      </label>
      <div id="cam" hidden><video id="vid" playsinline muted></video><div id="h5"></div></div>
      <button class="btn pri" id="camBtn" type="button">Start camera</button>
      <form class="manual" id="mf"><input id="mo" inputmode="numeric" placeholder="Or type the order no"><button class="btn" type="submit">Add</button></form>
    </div>
    <div class="sumline"><span id="pCnt"></span><span id="pCod"></span></div>
    <div id="pList"></div>
    <button class="btn" id="pPdf" type="button" hidden>Download pickup sheet (PDF)</button>
  </section>
  <section id="v-del" hidden></section>
  <section id="v-rep" hidden></section>
</main>

<div class="modal" id="modal">
  <div class="msheet">
    <h4 id="mTitle">Remarks</h4>
    <textarea id="mText" maxlength="300" placeholder="Write the reason (required)"></textarea>
    <div class="mb"><button type="button" id="mNo">Cancel</button><button type="button" id="mYes">Save</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ SETTINGS ============ */
// PostEx_Master ka Web app URL (index.html wala hi URL)
const API_URL = 'https://script.google.com/macros/s/AKfycbybfChhFP8Hwcmc7PXWza18wtlq12t9yaxKIbq2O_5fX6ZcotTe_9tMYm3tp665YwQy/exec';
/* ================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10) || 0;
const rs = n => 'Rs ' + Number(n || 0).toLocaleString('en-US');
const sum = (a, f) => a.reduce((t, o) => t + (f(o) || 0), 0);
const key = o => String(Number(String(o.orderNo).replace(/\D/g, '')) || '');
const get = k => { try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } };
const put = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };

let me = {name:'', admin:false, rider:false}, today = '', todayList = [], active = [], tab = 'pickup';
let report = null, repDate = '', riders = [], repRider = '';

function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2400); }
function beep(ok){
  try{
    const c = beep.c || (beep.c = new (window.AudioContext || window.webkitAudioContext)()), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = ok ? 880 : 220; g.gain.value = .15; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + (ok ? .12 : .35));
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(ok ? 60 : [120, 60, 120]); }catch(e){}
}

/* ---------- api / login ---------- */
async function api(params){
  const k = get('rk'), u = get('ru');
  if (!k || !u){ showLogin(); throw new Error('login'); }
  if (!API_URL || API_URL.indexOf('PASTE_') === 0){ toast('API link is not set'); throw new Error('url'); }
  const r = await fetch(API_URL + '?' + new URLSearchParams(Object.assign({u: u, key: k}, params)).toString());
  const d = await r.json();
  if (d.me){ me = d.me; $('who').textContent = me.name + (me.admin ? ' \u00b7 Admin' : ''); }
  if (!d.ok && /password/i.test(d.error || '')){ put('rk', ''); showLogin(d.error); }
  return d;
}
function showLogin(msg){ $('loginErr').textContent = msg || ''; $('userIn').value = get('ru'); $('login').classList.add('show'); }
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const u = $('userIn').value.trim(), k = $('keyIn').value.trim(); if (!u || !k) return;
  put('ru', u); put('rk', k); $('keyIn').value = ''; $('login').classList.remove('show'); init();
});
$('logout').addEventListener('click', () => { put('rk', ''); stopCam(); showLogin(); });

/* ---------- tabs ---------- */
function setTab(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ['pickup', 'del', 'rep'].forEach(x => { $('v-' + x).hidden = x !== t; });
  if (t !== 'pickup') stopCam();
  if (t === 'rep') loadReport();
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.t); });

async function init(){
  $('v-del').innerHTML = $('v-rep').innerHTML = '';
  try{
    if (get('rk')){
      const d = await api({action: 'r_list'});
      if (!d.ok){ if (!/password/i.test(d.error || '')) toast(d.error || 'Something went wrong'); return; }
      today = d.date; todayList = d.today; active = d.active;
      if (me.admin){
        document.querySelectorAll('.tab').forEach(b => { b.hidden = b.dataset.t !== 'rep'; });
        const r = await api({action: 'r_riders'}); riders = r.riders || []; repRider = riders[0] || '';
        setTab('rep'); return;
      }
      $('dcDef').value = get('dcDef');
      renderPickup(); renderDel(); setTab('pickup');
    } else showLogin();
  }catch(e){ if (String(e.message) !== 'login' && String(e.message) !== 'url') toast('Connection problem'); }
}

/* ---------- pickup ---------- */
const pill = st => '<span class="pill ' + ({Picked:'run', Delivered:'ok', Returned:'bad'}[st] || '') + '">' + esc(st) + '</span>';
function renderPickup(){
  const a = document.activeElement, fo = a && a.classList && a.classList.contains('dc') ? {o: a.dataset.o, v: a.value} : null;
  const ready = todayList.filter(o => !o._pending), open = ready.filter(o => !o.locked);
  $('pCnt').textContent = todayList.length + ' scanned today';
  $('pCod').textContent = 'COD ' + rs(sum(ready, o => num(o.cod))) + ' \u00b7 D.C ' + rs(sum(ready, o => o.dc));
  $('pPdf').hidden = !ready.length;
  let h = open.length ? '<button class="btn pri" id="lockAll" type="button" style="margin:0 0 10px">Done: lock all D.C (' + open.length + ')</button>' : '';
  h += todayList.map(o => {
    const k = esc(key(o));
    const dcBox = o._pending ? '' : o.locked
      ? '<div class="dcl">D.C ' + rs(o.dc) + ' &middot; locked</div>'
      : '<label class="dcr">D.C Rs <input class="dc" inputmode="numeric" data-o="' + k + '" value="' + (o.dcSet ? o.dc : '') + '" placeholder="0"><button class="dcdone" type="button" data-o="' + k + '">Done</button></label>';
    return '<div class="li"><div class="lh"><b>#' + esc(o.orderNo) + '</b><span class="nm">' + esc(o._pending ? 'Saving...' : (o.name || 'No name')) + '</span>'
      + (o._pending ? '<span class="pill">Saving</span>' : pill(o.status)) + '</div>'
      + (o._pending ? '' : '<div class="ls">' + esc(o.city || '-') + ' &middot; COD ' + rs(num(o.cod)) + '</div>') + dcBox + '</div>';
  }).join('');
  $('pList').innerHTML = todayList.length ? h : '<div class="note">Scan a slip barcode or type the order number to start the pickup.</div>';
  if (fo){ const n = document.querySelector('.dc[data-o="' + fo.o + '"]'); if (n){ n.value = fo.v; n.focus(); } }
}
async function saveDc(nos, dc, lockIt){
  const prev = [];
  [todayList, active].forEach(L => L.forEach(o => {
    if (nos.indexOf(key(o)) >= 0){ prev.push({o: o, dc: o.dc, dcSet: o.dcSet, locked: o.locked}); if (dc !== undefined){ o.dc = dc; o.dcSet = true; } if (lockIt) o.locked = true; }
  }));
  renderPickup(); renderDel();
  try{
    const p = {action: 'r_dc', orders: nos.join(',')}; if (dc !== undefined) p.dc = dc; if (lockIt) p.lock = 1;
    const d = await api(p);
    if (!d.ok) throw new Error(d.error || 'fail');
    if (d.skipped && d.skipped.length) toast(d.skipped.length + ' parcel(s) were already locked');
  }catch(x){
    prev.forEach(r => { r.o.dc = r.dc; r.o.dcSet = r.dcSet; r.o.locked = r.locked; });
    renderPickup(); renderDel(); toast('Could not save D.C. Try again.');
  }
}
$('pList').addEventListener('change', e => { const i = e.target.closest('.dc'); if (i) saveDc([i.dataset.o], num(i.value), false); });
$('pList').addEventListener('click', e => {
  const b = e.target.closest('.dcdone');
  if (b){ const inp = document.querySelector('.dc[data-o="' + b.dataset.o + '"]'); saveDc([b.dataset.o], inp ? num(inp.value) : undefined, true); return; }
  if (e.target.closest('#lockAll')){
    const nos = todayList.filter(o => !o._pending && !o.locked).map(key); if (!nos.length) return;
    if (confirm('Lock D.C for ' + nos.length + ' parcels? You cannot change it afterwards.')) saveDc(nos, undefined, true);
  }
});
$('dcDef').addEventListener('change', () => put('dcDef', String(num($('dcDef').value) || '')));

const queue = []; let busy = false;
function onCode(raw){
  const now = Date.now();
  if (raw === onCode.last && now - onCode.at < 2500) return;
  onCode.last = raw; onCode.at = now;
  const dg = String(raw).replace(/\D/g, ''); if (!dg){ toast('Unreadable barcode'); beep(false); return; }
  const no = String(Number(dg));
  if (todayList.some(o => key(o) === no)){ toast('#' + no + ' is already scanned'); beep(false); return; }
  const dc = num(get('dcDef'));
  todayList.unshift({orderNo: no, cod: 0, dc: dc, dcSet: dc > 0, locked: false, status: 'Picked', _pending: true});
  beep(true); renderPickup(); queue.push(no); pump();
}
async function pump(){
  if (busy) return; busy = true;
  while (queue.length){
    const batch = queue.splice(0, 20);
    try{
      const d = await api({action: 'r_scan', orders: batch.join(','), dc: get('dcDef')});
      if (!d.ok) throw new Error(d.error || 'fail');
      d.results.forEach(r => {
        const i = todayList.findIndex(o => o._pending && key(o) === r.order);
        if (!r.ok){ if (i >= 0) todayList.splice(i, 1); toast(r.error || 'Scan failed'); beep(false); return; }
        if (i >= 0) todayList[i] = r.parcel; else todayList.unshift(r.parcel);
        const k = key(r.parcel); active = active.filter(o => key(o) !== k); active.unshift(r.parcel);
        if (r.msg) toast('#' + r.order + ' (' + r.msg + ')');
      });
    }catch(e){
      batch.forEach(no => { const i = todayList.findIndex(o => o._pending && key(o) === no); if (i >= 0) todayList.splice(i, 1); });
      toast('Could not save the scan. Please scan again.'); beep(false);
    }
    renderPickup(); renderDel();
  }
  busy = false;
}
$('mf').addEventListener('submit', e => { e.preventDefault(); const v = $('mo').value.trim(); if (v){ onCode(v + ' '); $('mo').value = ''; } });

/* camera scanner: BarcodeDetector, warna html5-qrcode */
let stream = null, scanning = false, h5 = null;
function loadScript(src){ return new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => no(new Error('load')); document.head.appendChild(el); }); }
async function startCam(){
  if (scanning) return;
  $('cam').hidden = false;
  try{
    if ('BarcodeDetector' in window){
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false});
      const v = $('vid'); v.hidden = false; v.srcObject = stream; await v.play();
      const det = new BarcodeDetector(); scanning = true;
      const tick = async () => { if (!scanning) return; try{ const r = await det.detect(v); if (r.length) onCode(r[0].rawValue); }catch(e){} setTimeout(tick, 220); };
      tick();
    } else {
      $('vid').hidden = true;
      await loadScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');
      h5 = new Html5Qrcode('h5');
      await h5.start({facingMode: 'environment'}, {fps: 10, qrbox: {width: 260, height: 140}}, t => onCode(t));
      scanning = true;
    }
    $('camBtn').textContent = 'Stop camera';
  }catch(e){ stopCam(); toast('Camera could not start. Allow camera access or type the order no.'); }
}
async function stopCam(){
  scanning = false;
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (h5){ try{ await h5.stop(); h5.clear(); }catch(e){} h5 = null; }
  $('cam').hidden = true; $('camBtn').textContent = 'Start camera';
}
$('camBtn').addEventListener('click', () => scanning ? stopCam() : startCam());

/* ---------- deliveries ---------- */
function renderDel(){
  const L = active.slice().sort((a, b) => (a.status === b.status ? 0 : a.status === 'Picked' ? -1 : 1));
  $('delCnt').textContent = L.length ? '(' + L.length + ')' : '';
  const ph = o => String(o.number || '').replace(/\D/g, '').slice(-10);
  $('v-del').innerHTML = L.length ? L.map(o => {
    const k = esc(key(o));
    return '<div class="li"><div class="lh"><b>#' + esc(o.orderNo) + '</b><span class="nm">' + esc(o.name || 'No name') + '</span>' + pill(o.status) + '</div>'
      + '<div class="ls">' + esc(o.city || '-') + (ph(o).length === 10 ? ' &middot; <a href="tel:+92' + ph(o) + '">0' + ph(o) + '</a>' : '') + '</div>'
      + '<div class="ls">COD <b>' + rs(num(o.cod)) + '</b> &middot; D.C ' + rs(o.dc) + ' &middot; Picked ' + esc(o.pickup || '') + '</div>'
      + (o.remarks ? '<div class="rm">' + esc(o.remarks) + '</div>' : '')
      + '<div class="acts"><button class="ab ok" data-s="Delivered" data-o="' + k + '">Delivered</button><button class="ab wait" data-s="Pending" data-o="' + k + '">Pending</button><button class="ab bad" data-s="Returned" data-o="' + k + '">Returned</button></div></div>';
  }).join('') : '<div class="note">No parcels with you right now.</div>';
}
function askRemarks(title){
  return new Promise(res => {
    $('mTitle').textContent = title; $('mText').value = ''; $('modal').classList.add('show'); setTimeout(() => $('mText').focus(), 60);
    const done = v => { $('modal').classList.remove('show'); $('mYes').onclick = $('mNo').onclick = null; res(v); };
    $('mYes').onclick = () => { const v = $('mText').value.trim(); if (v.length < 2){ toast('Please write the remarks'); return; } done(v); };
    $('mNo').onclick = () => done(null);
  });
}
$('v-del').addEventListener('click', async e => {
  const b = e.target.closest('.ab'); if (!b) return;
  const no = b.dataset.o, st = b.dataset.s; let remarks = '';
  if (st !== 'Delivered'){ remarks = await askRemarks(st + ' - remarks'); if (remarks === null) return; }
  const snap = [], was = active.slice();
  [todayList, active].forEach(L => L.forEach(o => { if (key(o) === no){ snap.push({o: o, status: o.status, remarks: o.remarks}); o.status = st; if (remarks) o.remarks = remarks; } }));
  if (st !== 'Pending') active = active.filter(o => key(o) !== no);
  toast('#' + no + ' marked ' + st); renderDel(); renderPickup();
  try{
    const d = await api({action: 'r_status', order: no, status: st, remarks: remarks});
    if (!d.ok) throw new Error(d.error || 'fail');
    if (tab === 'rep') loadReport();
  }catch(x){
    snap.forEach(s => { s.o.status = s.status; s.o.remarks = s.remarks; }); active = was;
    renderDel(); renderPickup(); toast('Could not update #' + no + '. Please try again.'); beep(false);
  }
});

/* ---------- report ---------- */
const toIso = d => { const m = String(d).split('/'); return m.length === 3 ? m[2] + '-' + m[1] + '-' + m[0] : ''; };
const fromIso = s => { const m = String(s).split('-'); return m.length === 3 ? m[2] + '/' + m[1] + '/' + m[0] : ''; };
async function loadReport(){
  if (!repDate) repDate = today;
  const box = $('v-rep');
  if (!report) box.innerHTML = '<div class="note"><div class="spin"></div>Loading...</div>';
  try{
    const p = {action: 'r_report', date: repDate}; if (me.admin) p.rider = repRider;
    const d = await api(p);
    if (!d.ok){ box.innerHTML = '<div class="note">' + esc(d.error || 'Something went wrong') + '</div>'; return; }
    report = d; renderReport();
  }catch(e){ box.innerHTML = '<div class="note">Connection problem</div>'; }
}
function calc(r){
  const cod = sum(r.delivered, o => num(o.cod)), dc = sum(r.delivered, o => o.dc);
  return {cod: cod, dc: dc, cash: cod - dc - r.online};
}
function renderReport(){
  const r = report, c = calc(r), isToday = r.date === r.today;
  let h = '<div class="card">'
    + (me.admin ? '<label class="fld">Rider<select id="rsel">' + riders.map(x => '<option' + (x === repRider ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></label>' : '')
    + '<label class="fld" style="margin:0">Date<input type="date" id="rdate" value="' + esc(toIso(r.date)) + '"></label></div>';
  if (!me.admin && isToday && r.unresolved.length){
    h += '<div class="note warn"><b>' + r.unresolved.length + ' parcel(s) are not updated yet.</b><br>Mark each one Delivered, Pending or Returned to unlock the day-end report.'
      + '<button class="btn pri" id="goDel" type="button">Go to Deliveries</button></div>';
    $('v-rep').innerHTML = h; bindReport(); return;
  }
  if (me.admin && r.unresolved.length) h += '<div class="note warn" style="margin-bottom:12px">' + r.unresolved.length + ' parcel(s) are still not updated by the rider.</div>';
  h += '<div class="tiles"><div class="tile"><b>' + r.picked.length + '</b><span>Picked up</span></div><div class="tile"><b>' + r.delivered.length + '</b><span>Delivered</span></div>'
    + '<div class="tile"><b>' + r.returned.length + '</b><span>Returned</span></div><div class="tile"><b>' + r.pending.length + '</b><span>Pending (with rider)</span></div></div>'
    + '<div class="card pay"><div class="r"><span>Delivered COD total</span><b>' + rs(c.cod) + '</b></div>'
    + '<div class="r"><span>&minus; D.C (delivered parcels)</span><b>' + rs(c.dc) + '</b></div>'
    + '<div class="r"><span>&minus; Online payments received</span><input id="online" inputmode="numeric" value="' + (r.online || '') + '" placeholder="0"></div>'
    + '<div class="r tot"><span>Cash to hand over</span><b id="cash">' + rs(c.cash) + '</b></div></div>';
  const tbl = (title, L, withRm) => L.length ? '<h3>' + title + ' (' + L.length + ')</h3>' + L.map(o =>
    '<div class="li"><div class="lh"><b>#' + esc(o.orderNo) + '</b><span class="nm">' + esc(o.name || 'No name') + '</span><b>' + rs(num(o.cod)) + '</b></div>'
    + '<div class="ls">' + esc(o.city || '-') + (withRm ? '' : ' &middot; D.C ' + rs(o.dc)) + '</div>' + (withRm && o.remarks ? '<div class="rm">' + esc(o.remarks) + '</div>' : '') + '</div>').join('') : '';
  h += tbl('Delivered', r.delivered, false) + tbl('Returned', r.returned, true) + tbl('Pending', r.pending, true)
    + '<button class="btn pri" id="repPdf" type="button">Download report (PDF)</button>';
  $('v-rep').innerHTML = h; bindReport();
}
function bindReport(){
  if ($('goDel')) $('goDel').addEventListener('click', () => setTab('del'));
  if ($('rdate')) $('rdate').addEventListener('change', e => { if (e.target.value){ repDate = fromIso(e.target.value); report = null; loadReport(); } });
  if ($('rsel')) $('rsel').addEventListener('change', e => { repRider = e.target.value; report = null; loadReport(); });
  if ($('repPdf')) $('repPdf').addEventListener('click', reportPdf);
  if ($('online')) $('online').addEventListener('change', async e => {
    const amt = num(e.target.value);
    try{
      const p = {action: 'r_online', date: report.date, amount: amt}; if (me.admin) p.rider = repRider;
      const d = await api(p);
      if (!d.ok){ toast(d.error || 'Could not save'); return; }
      report.online = amt; $('cash').textContent = rs(calc(report).cash); toast('Saved');
    }catch(x){ toast('Could not save'); }
  });
}

/* ---------- PDFs ---------- */
async function pdfLib(){
  if (!(window.jspdf && window.jspdf.jsPDF)){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  }
  const doc = new window.jspdf.jsPDF({orientation: 'portrait', unit: 'pt', format: 'a4'});
  return doc;
}
const HEAD = {fillColor: [15, 31, 61], textColor: [200, 162, 74]};
async function pickupPdf(){
  const L = todayList.filter(o => !o._pending); if (!L.length) return; toast('Creating PDF...');
  try{
    const doc = await pdfLib(), nm = me.name;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Royal Welcome - Pickup Sheet', 40, 42);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.text('Rider: ' + nm + '   |   Date: ' + today + '   |   ' + L.length + ' parcels', 40, 58);
    const ph = o => { const d = String(o.number || '').replace(/\D/g, '').slice(-10); return d.length === 10 ? '0' + d.slice(0, 3) + ' ' + d.slice(3) : (o.number || ''); };
    doc.autoTable({
      startY: 70, theme: 'grid', styles: {fontSize: 8.5, cellPadding: 4}, headStyles: HEAD, alternateRowStyles: {fillColor: [245, 247, 251]},
      head: [['#', 'Order No', 'Name', 'Number', 'City', 'COD', 'D.C']],
      body: L.map((o, i) => [i + 1, o.orderNo, o.name || '', ph(o), o.city || '', rs(num(o.cod)), rs(o.dc)]),
      foot: [['', '', '', '', 'Total', rs(sum(L, o => num(o.cod))), rs(sum(L, o => o.dc))]],
      footStyles: {fillColor: [235, 238, 244], textColor: [27, 39, 64], fontStyle: 'bold'},
      columnStyles: {0: {cellWidth: 22}, 5: {halign: 'right'}, 6: {halign: 'right'}}
    });
    doc.save('Pickup_' + nm + '_' + today.replace(/\//g, '-') + '.pdf');
  }catch(e){ toast('Could not create the PDF. Check your internet.'); }
}
$('pPdf').addEventListener('click', pickupPdf);
async function reportPdf(){
  const r = report; if (!r) return; toast('Creating PDF...');
  try{
    const doc = await pdfLib(), c = calc(r);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Royal Welcome - Rider Day Report', 40, 42);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text('Rider: ' + r.rider + '   |   Date: ' + r.date, 40, 58);
    doc.autoTable({
      startY: 70, theme: 'grid', styles: {fontSize: 10, cellPadding: 5}, headStyles: HEAD,
      head: [['Summary', 'Count']],
      body: [['Total picked up', r.picked.length], ['Delivered', r.delivered.length], ['Returned', r.returned.length], ['Pending (with rider)', r.pending.length]]
    });
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 14, theme: 'grid', styles: {fontSize: 10, cellPadding: 5}, headStyles: HEAD,
      head: [['Payment', 'Amount']],
      body: [['Delivered COD total', rs(c.cod)], ['Less: D.C (delivered parcels)', rs(c.dc)], ['Less: Online payments received', rs(r.online)]],
      foot: [['Cash to hand over', rs(c.cash)]], footStyles: {fillColor: [235, 238, 244], textColor: [27, 39, 64], fontStyle: 'bold'},
      columnStyles: {1: {halign: 'right'}}
    });
    const T = (title, L, rm) => {
      if (!L.length) return;
      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 18, theme: 'grid', styles: {fontSize: 8.5, cellPadding: 4}, headStyles: HEAD,
        head: [[title + ' (' + L.length + ')', 'Name', 'City', 'COD', rm ? 'Remarks' : 'D.C']],
        body: L.map(o => ['#' + o.orderNo, o.name || '', o.city || '', rs(num(o.cod)), rm ? (o.remarks || '') : rs(o.dc)]),
        columnStyles: {3: {halign: 'right'}}
      });
    };
    T('Delivered', r.delivered, false); T('Returned', r.returned, true); T('Pending', r.pending, true);
    doc.save('Report_' + r.rider + '_' + r.date.replace(/\//g, '-') + '.pdf');
  }catch(e){ toast('Could not create the PDF. Check your internet.'); }
}

/* ---------- start ---------- */
if ('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
if (!get('rk') || !get('ru')) showLogin(); else init();
</script>
